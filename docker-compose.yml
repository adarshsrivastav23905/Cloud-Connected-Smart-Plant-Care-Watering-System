services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/plant_data.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    volumes:
      - plant-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend/react-app
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - python
      - sensor_simulator.py
      - --device-id
      - PLANT-001
      - --interval
      - "10"
      - --api-url
      - http://backend:8000/api/v1/sensor-readings
    restart: unless-stopped

volumes:
  plant-data:
